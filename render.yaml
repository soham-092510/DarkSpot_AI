# DarkSpot AI — Render Blueprint (Infrastructure-as-Code)
# Official deployment definition for Render Cloud Platform (https://render.com)
#
# Services created:
# 1. darkspot-db: Managed PostgreSQL Database
# 2. darkspot-api: FastAPI Python Backend Web Service
# 3. darkspot-worker: Python Asynchronous Background Analysis Worker
# 4. darkspot-frontend: Next.js 14 App Router Node Web Service

envVarGroups:
  - name: darkspot-security
    envVars:
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: darkspot-db
    databaseName: darkspot
    user: darkspot
    plan: free

services:
  # 1. FastAPI REST API Web Service
  - type: web
    name: darkspot-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - fromGroup: darkspot-security
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: darkspot-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'

  # 2. Asynchronous Background Analysis Worker
  - type: worker
    name: darkspot-worker
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.app.workers.analysis_worker
    envVars:
      - fromGroup: darkspot-security
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: darkspot-db
          property: connectionString

  # 3. Next.js 14 Frontend Web Application
  - type: web
    name: darkspot-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: darkspot-api
          property: host
